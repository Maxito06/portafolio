<div
  class="project-card tarjeta tarjeta--interactiva"
  [class.project-card--destacado]="proyecto().destacado"
>
  <div class="card-imagen">
    <img [ngSrc]="proyecto().imagen" [alt]="proyecto().titulo" fill />
  </div>
  <div class="card-contenido">
    @if (proyecto().destacado) {
      <span class="etiqueta">PROYECTO DESTACADO</span>
    }
    <h3>
      <button type="button" class="card-boton" (click)="seleccionar.emit(proyecto())">
        {{ proyecto().titulo }}
      </button>
    </h3>
    <p>{{ proyecto().descripcionCorta }}</p>
    <div class="tags">
      @for (tech of proyecto().stack; track tech) {
        <span class="skill-tag">{{ tech }}</span>
      }
    </div>
  </div>
</div>
