<header class="header">
  <div class="header__brand">
    <span class="etiqueta">INGENIERO DE SISTEMAS</span>
    <span class="header__name">Maximiliano Correa</span>
  </div>
  <nav class="header__nav">
    <a class="header__link" href="#proyectos" [attr.aria-current]="seccionActiva() === 'proyectos' ? 'location' : null">Proyectos</a>
    <a class="header__link" href="#sobre-mi" [attr.aria-current]="seccionActiva() === 'sobre-mi' ? 'location' : null">Sobre mí</a>
    <a class="header__link" href="#skills" [attr.aria-current]="seccionActiva() === 'skills' ? 'location' : null">Skills</a>
    <a class="header__link" href="#contacto" [attr.aria-current]="seccionActiva() === 'contacto' ? 'location' : null">Contacto</a>
  </nav>
  <button
    #botonMenu
    type="button"
    class="menu-toggle"
    [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
    [attr.aria-expanded]="menuAbierto()"
    aria-controls="menu-movil"
    (click)="toggleMenu()"
  >☰</button>
</header>

@if (menuAbierto()) {
  <div
    #overlay
    id="menu-movil"
    class="menu-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Menú de navegación"
    tabindex="-1"
    (click)="cerrarMenu()"
    (keydown)="atrapar($event)"
  >
    <button #botonCerrar type="button" class="menu-cerrar" aria-label="Cerrar menú" (click)="cerrarMenu()">×</button>
    <nav class="menu-overlay-nav" (click)="$event.stopPropagation()">
      <a href="#proyectos" (click)="cerrarMenu()">Proyectos</a>
      <a href="#sobre-mi" (click)="cerrarMenu()">Sobre mí</a>
      <a href="#skills" (click)="cerrarMenu()">Skills</a>
      <a href="#contacto" (click)="cerrarMenu()">Contacto</a>
    </nav>
  </div>
}
