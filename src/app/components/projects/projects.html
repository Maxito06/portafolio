<div class="projects">
  <h2 class="seccion-titulo">Proyectos</h2>

  <div class="projects-grid">
    @for (proyecto of proyectos; track proyecto.id) {
      <app-project-card
        [class.projects-grid__item--destacado]="proyecto.destacado"
        [proyecto]="proyecto" (seleccionar)="abrirModal(proyecto)"></app-project-card>
    }
  </div>

  @if (proyectoSeleccionado()) {
    <app-project-modal [proyecto]="proyectoSeleccionado()!" (cerrar)="cerrarModal()" />
  }
</div>
