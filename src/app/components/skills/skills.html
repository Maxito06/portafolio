<div class="skills">
  <h2 class="seccion-titulo">Skills</h2>

  <div class="skills-grid">
    @for (categoria of categorias; track categoria.nombre) {
      <div class="skills-card tarjeta">
        <span class="etiqueta">{{ categoria.nombre }}</span>
        <div class="skills-tags">
          @for (item of categoria.items; track item) {
            <span class="skill-tag">{{ item }}</span>
          }
        </div>
      </div>
    }
  </div>
</div>
